[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pockettitan"
version = "0.1.0"
description = "External-memory post-training quantization engine for extreme-scale LLMs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PocketTitan Team" }]
dependencies = [
    "torch>=2.1.0",
    "safetensors>=0.4.0",
    "huggingface_hub>=0.20.0",
    "transformers>=4.36.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
pockettitan = "pockettitan.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["pockettitan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "network: hits the Hugging Face CDN; deselected by default, run with `-m network`",
    "gpu: requires a CUDA device; deselected by default, run with `-m gpu`",
]
addopts = "-m 'not network and not gpu'"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]
