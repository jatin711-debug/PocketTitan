[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pockettitan"
version = "0.1.0"
description = "External-memory post-training quantization engine for extreme-scale LLMs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PocketTitan Team" }]
dependencies = [
    "torch>=2.1.0",
    "safetensors>=0.4.0",
    "huggingface_hub>=0.20.0",
    "transformers>=4.36.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
pockettitan = "pockettitan.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["pockettitan*"]
